name: Update job market paper abstract

# Reads the abstract from the published paper and commits it to research.md
# when it differs. Runs weekly, and on demand from the Actions tab.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pdfminer.six==20250506"
      - run: python scripts/update_jmp_abstract.py
      - name: Commit the abstract if it changed
        run: |
          if git diff --quiet -- research.md; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Update the job market paper abstract from the published PDF" research.md
          git push
